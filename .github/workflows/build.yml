name: Compilation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler le mod
        id: build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # Le résultat (jar ou journal d'erreurs) est publié sur la branche « build »,
      # pour qu'on puisse le récupérer sans compte.
      - name: Publier le résultat sur la branche build
        if: always()
        run: |
          mkdir -p /tmp/sortie && cd /tmp/sortie
          cp $GITHUB_WORKSPACE/build.log . || true
          cp $GITHUB_WORKSPACE/build/libs/*.jar . 2>/dev/null || true
          echo "${{ github.sha }} ${{ steps.build.outcome }}" > ETAT.txt
          git init -q -b build
          git config user.name "compilation"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Compilation de ${{ github.sha }} : ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build:build
