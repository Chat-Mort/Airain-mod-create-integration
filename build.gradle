plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }            // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' }   // Registrate
    maven { url = 'https://mvn.devos.one/snapshots/' }       // Registrate (miroir)
    maven { url = 'https://maven.terraformersmc.com/releases/' }   // EMI (compilation seulement)
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.ftb.dev/releases' }          // FTB Quests et FTB Library (compilation seulement : liste des chapitres)
    maven { url = 'https://maven.architectury.dev/' }           // Ars Nouveau (compilation seulement : le mod est installé à part)
}

dependencies {
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("dev.emi:emi-neoforge:1.1.18+1.21.1:api")   // 1.64 : recettes du mod dans EMI
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:2101.1.39") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:2101.1.40") { transitive = false }
    compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:5.13.+") { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
